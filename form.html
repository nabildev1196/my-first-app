<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Modern Form</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(255, 255, 255, 0.1);
      --input-focus: #818cf8;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Decorative background shapes */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.15;
      pointer-events: none;
    }

    .shape-1 {
      top: 10%;
      left: 15%;
      width: 300px;
      height: 300px;
      background: var(--primary);
    }

    .shape-2 {
      bottom: 15%;
      right: 10%;
      width: 400px;
      height: 400px;
      background: #a855f7;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 45px rgba(0, 0, 0, 0.35);
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      margin-bottom: 32px;
      font-weight: 300;
    }

    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }

    input, textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--input-focus);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Change label color on focus */
    .form-group:focus-within label {
      color: var(--input-focus);
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--primary-glow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #msg {
      margin-top: 24px;
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      min-height: 24px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #msg.show {
      opacity: 1;
      transform: translateY(0);
    }

    #msg.success {
      color: var(--success);
      text-shadow: 0 0 10px rgba(52, 211, 153, 0.2);
    }

    #msg.error {
      color: #f87171;
    }

    /* Mobile responsive adjustments */
    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
        border-radius: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <h1>Contact us</h1>
    <div class="subtitle">Drop us a line and we'll get back to you shortly.</div>

    <form id="contactForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="Phone number">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="What can we help you with?"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>Send Message</span>
      </button>
    </form>

    <p id="msg"></p>
  </div>

  <script>
    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const msgElement = document.getElementById('msg');
    const URL = "https://script.google.com/macros/s/AKfycbzYweP57tDiLdNnX05X4EmNB5YRQvOU0e6_qPFPK23Efx4ud0T_czTAkVJ4A4DO0wdvJQ/exec";

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      // Disable button & update UI status
      submitBtn.disabled = true;
      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span>Sending...</span>';

      // Hide previous message
      msgElement.classList.remove('show', 'success', 'error');

      // Get values from form
      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        message: document.getElementById('message').value
      };

      try {
        // Perform the POST request matching exact requested shape
        await fetch(URL, {
          method: "POST",
          mode: "no-cors",
          body: JSON.stringify(data)
        });

        // Show success message
        msgElement.innerText = "Thanks! We'll get back to you.";
        msgElement.className = "success show";

        // Reset the form
        form.reset();

      } catch (error) {
        console.error('Error submitting form:', error);
        msgElement.innerText = "An error occurred. Please try again.";
        msgElement.className = "error show";
      } finally {
        // Re-enable button
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
      }
    });
  </script>
</body>
</html>
